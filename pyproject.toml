[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-panel-core"
version = "0.1.1"
description = "Shared Home Panel configuration model, validation and read/check protocol"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Source = "https://github.com/int0x19/home-panel-core"
Issues = "https://github.com/int0x19/home-panel-core/issues"

[project.optional-dependencies]
http = ["aiohttp>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
home_panel_core = ["assets/*.mjs", "testing_data/*.json"]
