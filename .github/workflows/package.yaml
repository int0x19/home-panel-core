name: Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install setuptools wheel aiohttp
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - run: python -m pip install --no-deps dist/*.whl
      - run: node --version
      - run: python -m unittest discover -s tests -v
        env:
          PANEL_CONFIG_HTTP_TEST: '1'
      - name: Check release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == version, 'Tag must match package version exactly'
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: core-wheel
          path: dist/*.whl
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: core-wheel
          path: dist
      - name: Create unpublished release for owner review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
